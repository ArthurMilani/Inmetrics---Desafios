apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: arthurmilanigiovanini/flask-image:latest
          ports:
            - containerPort: 5000
            - containerPort: 5001
            - containerPort: 5002
            - containerPort: 5003

          envFrom:
            - secretRef:
                name: db-secret